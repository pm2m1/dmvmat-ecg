[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dmvmat-ecg"
version = "0.1.0"
description = "Independent, locked PTB-XL five-superclass ECG benchmark"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
  "torch==2.15.0", "numpy==2.5.4", "pandas==3.1.1", "scipy==1.18.1",
  "scikit-learn==1.9.1", "matplotlib==3.11.2", "wfdb>=4.3,<5",
  "pytest==9.2.0", "ruff==0.17.4", "httpx>=0.28,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/dmvmat_ecg/models/vendor"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
